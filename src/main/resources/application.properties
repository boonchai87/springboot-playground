spring.application.name=springboot-playground-dev
# https://www.baeldung.com/spring-profiles
spring.profiles.active=@spring.profiles.active@

#h2 configuration, plese use jdbc:h2:mem:testdb in h2-console
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

## PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DBNAME}?sslmode=${POSTGRES_SSLMODE}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

# create and drop table, good for testing, production set to none or comment it
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto = update
## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

#spring.data.elasticsearch.cluster-name=elasticsearch
#spring.data.elasticsearch.cluster-nodes=localhost:9200
#spring.data.elasticsearch.repositories.enabled=true
#
#spring.devtools.livereload.enabled=true
#spring.devtools.restart.log-condition-evaluation-delta=false

# Zipkin configuration
#https://mohosinmiah1610.medium.com/how-to-implement-zipkin-in-spring-boot-3-683e9d61a94c
#docker run -d -p 9411:9411 openzipkin/zipkin
spring.zipkin.base-url=http://localhost:9411/
spring.sleuth.sampler.probability=1.0

# https://medium.com/isop-nepal/spring-boot-admin-setup-8e5961bbea5d
spring.boot.admin.client.url=http://localhost:9090
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.endpoint.health.show-details=always

